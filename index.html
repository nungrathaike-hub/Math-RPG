<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Math - Educational RPG</title>
    <style>
        /* --- GDD 16 & 19: Visual Style & Responsive Design --- */
        :root {
            --primary-bg: #1a1a2e;
            --secondary-bg: #16213e;
            --accent-color: #0f3460;
            --text-light: #e94560;
            --health-color: #ff4757;
            --mana-color: #1e90ff;
            --parchment: #f1e2c3;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* High legibility */
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Scalable 16:9 Canvas */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* --- Screen Flow (GDD 15) --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* --- Main Menu --- */
        #menu-screen {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, var(--accent-color), var(--primary-bg));
        }

        h1 {
            font-size: 5vw;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 2vw;
            font-weight: bold;
            background-color: var(--text-light);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #ff5e78;
        }

        /* --- Combat UI (GDD 13) --- */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            height: 15%;
        }

        .stat-box {
            width: 30%;
        }

        .stat-name {
            font-weight: bold;
            font-size: 1.5vw;
            margin-bottom: 5px;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 2px solid #555;
        }

        .bar {
            height: 100%;
            transition: width 0.3s ease-in-out; /* GDD 18: UI Animations */
        }

        .hp-bar { background-color: var(--health-color); width: 100%; }
        .mp-bar { background-color: var(--mana-color); width: 100%; }

        #combat-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Combat Focus (GDD 13) */
        #math-modal {
            background-color: var(--parchment);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid var(--gold);
            text-align: center;
            width: 50%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        #timer-bar-container {
            width: 100%;
            height: 10px;
            background: #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        #timer-bar {
            height: 100%;
            background: #2ed573;
            width: 100%;
        }

        #equation {
            font-size: 4vw;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #answer-display {
            font-size: 3vw;
            height: 4vw;
            border-bottom: 3px solid #333;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        /* Dynamic Numpad (GDD 13 & 19) */
        #numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .num-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 2vw;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .num-btn:active {
            background: var(--secondary-bg);
        }

        .num-btn.special {
            background: var(--text-light);
        }

        /* Feedback Animation */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* --- End Screen --- */
        #end-screen {
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
            text-align: center;
        }

        #end-message {
            font-size: 4vw;
            margin-bottom: 20px;
        }

        #stars {
            font-size: 5vw;
            color: var(--gold);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 1. Main Menu Screen -->
        <div id="menu-screen" class="screen active">
            <h1>MAGIC MATH</h1>
            <p style="margin-bottom: 30px; font-size: 1.5vw;">Chapter 1: The Shores of Absolute Value</p>
            <button class="btn" onclick="startGame()">Enter the Void</button>
        </div>

        <!-- 2. Combat Screen -->
        <div id="combat-screen" class="screen">
            <!-- HUD -->
            <div id="hud">
                <div class="stat-box">
                    <div class="stat-name">Aria (Apprentice)</div>
                    <div class="bar-container"><div id="player-hp" class="bar hp-bar"></div></div>
                    <div class="bar-container"><div id="player-mp" class="bar mp-bar"></div></div>
                </div>
                <div class="stat-box" style="text-align: right;">
                    <div class="stat-name">The Minus Minotaur</div>
                    <div class="bar-container" style="justify-content: flex-end; display: flex;">
                        <div id="enemy-hp" class="bar hp-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Combat Area / Focus -->
            <div id="combat-area">
                <div id="math-modal">
                    <div id="timer-bar-container">
                        <div id="timer-bar"></div>
                    </div>
                    <div id="equation">-5 + 8 = ?</div>
                    <div id="answer-display"></div>
                    
                    <!-- Numpad -->
                    <div id="numpad">
                        <button class="num-btn" onclick="inputNumber(7)">7</button>
                        <button class="num-btn" onclick="inputNumber(8)">8</button>
                        <button class="num-btn" onclick="inputNumber(9)">9</button>
                        <button class="num-btn" onclick="inputNumber(4)">4</button>
                        <button class="num-btn" onclick="inputNumber(5)">5</button>
                        <button class="num-btn" onclick="inputNumber(6)">6</button>
                        <button class="num-btn" onclick="inputNumber(1)">1</button>
                        <button class="num-btn" onclick="inputNumber(2)">2</button>
                        <button class="num-btn" onclick="inputNumber(3)">3</button>
                        <button class="num-btn special" onclick="inputMinus()">-</button>
                        <button class="num-btn" onclick="inputNumber(0)">0</button>
                        <button class="num-btn special" onclick="submitAnswer()">Cast</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Victory/Defeat Screen -->
        <div id="end-screen" class="screen">
            <div id="end-message">Victory!</div>
            <div id="stars">★★★</div>
            <p id="accuracy-stat" style="margin-bottom: 20px; font-size: 1.5vw;"></p>
            <button class="btn" onclick="resetGame()">Return to Map</button>
        </div>
    </div>

    <script>
        /* --- GDD 7 & 9: Player Progression & Game Mechanics --- */
        let player = { maxHp: 100, hp: 100, mp: 50 };
        let enemy = { maxHp: 100, hp: 100, name: "Minus Minotaur" };
        
        // Combat State
        let currentAnswer = "";
        let expectedAnswer = 0;
        let timerInterval;
        let timeLeft = 10;
        const TIME_LIMIT = 10; // 10 seconds to answer
        let questionsAsked = 0;
        let questionsCorrect = 0;

        // DOM Elements
        const screens = {
            menu: document.getElementById('menu-screen'),
            combat: document.getElementById('combat-screen'),
            end: document.getElementById('end-screen')
        };
        const displays = {
            playerHp: document.getElementById('player-hp'),
            enemyHp: document.getElementById('enemy-hp'),
            equation: document.getElementById('equation'),
            answer: document.getElementById('answer-display'),
            timerBar: document.getElementById('timer-bar'),
            mathModal: document.getElementById('math-modal')
        };

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function startGame() {
            // Reset Stats
            player.hp = player.maxHp;
            enemy.hp = enemy.maxHp;
            questionsAsked = 0;
            questionsCorrect = 0;
            updateHUD();
            switchScreen('combat');
            nextTurn();
        }

        function updateHUD() {
            displays.playerHp.style.width = `${(player.hp / player.maxHp) * 100}%`;
            displays.enemyHp.style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
        }

        /* --- GDD 8: Mathematics Learning Objectives (Grade 7 Integers) --- */
        function generateProblem() {
            // Generates positive and negative integer addition/subtraction
            const num1 = Math.floor(Math.random() * 21) - 10; // -10 to 10
            const num2 = Math.floor(Math.random() * 21) - 10;
            const isAddition = Math.random() > 0.5;

            if (isAddition) {
                expectedAnswer = num1 + num2;
                displays.equation.innerText = `${num1} + ${num2 < 0 ? `(${num2})` : num2} = ?`;
            } else {
                expectedAnswer = num1 - num2;
                displays.equation.innerText = `${num1} - ${num2 < 0 ? `(${num2})` : num2} = ?`;
            }

            currentAnswer = "";
            displays.answer.innerText = "";
            questionsAsked++;
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            displays.timerBar.style.width = '100%';
            displays.timerBar.style.backgroundColor = '#2ed573';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const percentage = (timeLeft / TIME_LIMIT) * 100;
                displays.timerBar.style.width = `${percentage}%`;

                if (percentage < 30) {
                    displays.timerBar.style.backgroundColor = '#ff4757'; // Turn red when low
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer(); // "Fizzle" out of time
                }
            }, 100);
        }

        function nextTurn() {
            generateProblem();
            startTimer();
        }

        /* --- Numpad Logic --- */
        function inputNumber(num) {
            currentAnswer += num.toString();
            displays.answer.innerText = currentAnswer;
        }

        function inputMinus() {
            if (currentAnswer === "") {
                currentAnswer = "-";
            } else if (currentAnswer === "-") {
                currentAnswer = "";
            } else if (currentAnswer.startsWith("-")) {
                currentAnswer = currentAnswer.substring(1);
            } else {
                currentAnswer = "-" + currentAnswer;
            }
            displays.answer.innerText = currentAnswer;
        }

        /* --- Combat Resolution --- */
        function submitAnswer() {
            if (currentAnswer === "" || currentAnswer === "-") return;
            
            clearInterval(timerInterval);
            const parsedAnswer = parseInt(currentAnswer, 10);

            if (parsedAnswer === expectedAnswer) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        function handleCorrectAnswer() {
            questionsCorrect++;
            enemy.hp -= 34; // Roughly 3 hits to kill for protoype
            if (enemy.hp < 0) enemy.hp = 0;
            updateHUD();

            if (enemy.hp === 0) {
                setTimeout(endGame, 1000);
            } else {
                // Brief pause before next question
                setTimeout(nextTurn, 1000);
            }
        }

        function handleWrongAnswer() {
            // Visual feedback (GDD 14: Positive Reinforcement - soft fail, no harsh buzzers)
            displays.mathModal.classList.add('shake');
            setTimeout(() => displays.mathModal.classList.remove('shake'), 500);
            
            currentAnswer = "";
            displays.answer.innerText = "Fizzle...";

            player.hp -= 20; // Take damage
            if (player.hp < 0) player.hp = 0;
            updateHUD();

            if (player.hp === 0) {
                setTimeout(endGame, 1000);
            } else {
                setTimeout(nextTurn, 1500);
            }
        }

        /* --- GDD 10: Scoring System --- */
        function endGame() {
            clearInterval(timerInterval);
            switchScreen('end');
            
            const title = document.getElementById('end-message');
            const starsDisplay = document.getElementById('stars');
            const accuracyDisplay = document.getElementById('accuracy-stat');
            
            if (player.hp <= 0) {
                title.innerText = "Defeated...";
                title.style.color = "var(--health-color)";
                starsDisplay.innerText = "☆ ☆ ☆";
                accuracyDisplay.innerText = "Try reviewing Negative Integers!";
            } else {
                title.innerText = "Boss Defeated!";
                title.style.color = "var(--mana-color)";
                
                const accuracy = (questionsCorrect / questionsAsked) * 100;
                accuracyDisplay.innerText = `Accuracy: ${Math.round(accuracy)}%`;
                
                if (accuracy === 100) starsDisplay.innerText = "★ ★ ★";
                else if (accuracy >= 75) starsDisplay.innerText = "★ ★ ☆";
                else starsDisplay.innerText = "★ ☆ ☆";
            }
        }

        function resetGame() {
            switchScreen('menu');
        }
    </script>
</body>
</html>
